{% extends 'admin_panel/base.html' %}

{% block title %}Добавить товар | Панель администратора{% endblock %}
{% block page_title %}Добавить товар{% endblock %}

{% block content %}
<div class="form-card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="category">Категория *</label>
            <select id="category" name="category" required>
                <option value="">Выберите категорию</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="name">Название товара *</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="price">Цена (₽) *</label>
            <input type="number" id="price" name="price" step="0.01" required>
        </div>
        
        <div class="form-group">
            <label for="weight">Вес (г)</label>
            <input type="number" id="weight" name="weight" value="0">
        </div>
        
        <div class="form-group">
            <label for="pieces">Количество</label>
            <input type="number" id="pieces" name="pieces" value="0">
        </div>
        
        <div class="form-group">
            <label for="composition">Состав</label>
            <textarea id="composition" name="composition" rows="4" placeholder="Опишите состав блюда..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="image">Изображение</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="available" name="available" checked>
                <span>Товар доступен для заказа</span>
            </label>
        </div>
        
        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button type="submit" class="btn btn-primary">💾 Сохранить товар</button>
            <a href="{% url 'admin_panel:products_list' %}" class="btn btn-warning">↩️ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
